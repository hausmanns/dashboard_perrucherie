# Dashboard de la Perrucherie — one service, one port, DB bind-mounted.
#
#   docker compose up --build        # build + start (foreground)
#   docker compose up -d --build     # build + start (background)
#   PORT=9000 docker compose up -d   # custom host port
#
# After a `git pull` on another machine: `docker compose up -d --build`
# and the new code + the pulled database are live.

services:
  dashboard:
    build: .
    container_name: perrucherie
    ports:
      # host:container — change the left side via PORT if 8000 is taken
      - "${PORT:-8000}:8000"
    volumes:
      # The SQLite DB stays a real file in this repo checkout, so it keeps
      # travelling with git commits/pulls. Container is disposable, data is not.
      - ./data:/app/data
    environment:
      # Plant photo identification (OpenRouter). docker compose reads ./.env
      # automatically for interpolation, so just put your key in .env.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      # Telegram bot (watering reminders at 09:00 & 21:00).
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_TZ=${TELEGRAM_TZ:-}
      # Show tracker (search, trending, covers, episodes) — TMDb API key
      # (the short v3 "API Key", not the "API Read Access Token" JWT).
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      # Finances: documents (payslips, statements, tax bills) are read by a
      # LOCAL model first — any OpenAI-compatible server (Ollama, LM Studio…).
      # Default: Ollama on this machine, reached through host.docker.internal.
      # LLM_MODE=private_cloud: the local model only masks names, addresses,
      # numbers…; OpenRouter then reads the masked text (scans via Tesseract OCR).
      - LOCAL_LLM_BASE_URL=${LOCAL_LLM_BASE_URL:-}
      - LOCAL_LLM_MODEL=${LOCAL_LLM_MODEL:-}
      - LOCAL_LLM_API_KEY=${LOCAL_LLM_API_KEY:-}
      - LLM_MODE=${LLM_MODE:-}
      - RUNNING_IN_DOCKER=1
    extra_hosts:
      # lets the container reach Ollama on the host (Linux needs this line;
      # Docker Desktop on Windows/macOS knows the name already)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
